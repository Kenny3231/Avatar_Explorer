<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Page introuvable · Avatar Explorer</title>
    <!-- Page autonome (aucune dépendance externe) : servie par Cloudflare avec un vrai statut 404
         à la place du repli SPA qui renvoyait index.html en 200 pour toute URL inconnue. -->
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 16px; background: #020617; color: #f1f5f9;
            font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        main {
            width: 100%; max-width: 32rem; text-align: center; padding: 2.5rem 1.5rem;
            background: #0f172a; border: 1px solid #1e293b; border-radius: 2.5rem;
        }
        .code { margin: 0; font-size: 4.5rem; font-weight: 900; font-style: italic; letter-spacing: -0.05em; line-height: 1; color: #eab308; }
        h1 { margin: 1rem 0 0.5rem; font-size: 1.5rem; font-weight: 900; letter-spacing: -0.02em; }
        p { margin: 0 0 0.25rem; color: #94a3b8; line-height: 1.5; }
        p[lang="en"] { font-size: 0.875rem; }
        a {
            display: inline-block; margin-top: 1.75rem; padding: 0.875rem 1.75rem; border-radius: 9999px;
            background: #eab308; color: #020617; font-weight: 900; text-decoration: none;
        }
        a:hover { background: #facc15; }
        a:focus-visible { outline: 3px solid #fde047; outline-offset: 3px; }
    </style>
</head>
<body>
    <main>
        <p class="code" aria-hidden="true">404</p>
        <h1>Page introuvable</h1>
        <p>Cette adresse n'existe pas (ou plus) sur Avatar Explorer.</p>
        <p lang="en">This page doesn't exist.</p>
        <a href="/">Retour à l'accueil · Home</a>
    </main>
</body>
</html>
