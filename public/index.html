<!DOCTYPE html>
<html lang="fr" data-theme="classique">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#020617">
    <title>Avatar Explorer</title>
    <!-- Thème posé AVANT tout rendu (pas de flash) : data-theme sur <html>, fond, theme-color et,
         pour Néon/Cosmos seulement, polices Google chargées à la demande (font-display: swap).
         Registre des thèmes (les couleurs de fond sont des définitions de thème) exposé
         explicitement sur window.aeTheme pour le module principal. -->
    <script>
        window.aeTheme = (function () {
            var THEMES = {
                classique: { bg: '#020617' },
                neon: { bg: '#070A1A', font: 'https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,600;0,700;1,700&family=Rajdhani:wght@500;600;700&display=swap' },
                cosmos: { bg: '#0A0820', font: 'https://fonts.googleapis.com/css2?family=Outfit:wght@400..900&family=Syne:wght@700..800&display=swap' }
            };
            var KEY = 'bt_theme';
            var root = document.documentElement;
            var current = 'classique';
            var valid = function (t) { return typeof t === 'string' && Object.prototype.hasOwnProperty.call(THEMES, t); };

            // Le thème classique ne charge aucune police ; les autres injectent leur <link> une seule fois
            function loadFont(t) {
                var url = THEMES[t].font;
                if (!url || document.querySelector('link[data-font="' + t + '"]')) return;
                if (!document.querySelector('link[data-font-preconnect]')) {
                    var pc = document.createElement('link');
                    pc.rel = 'preconnect';
                    pc.href = 'https://fonts.gstatic.com';
                    pc.crossOrigin = 'anonymous';
                    pc.setAttribute('data-font-preconnect', '');
                    document.head.appendChild(pc);
                }
                var l = document.createElement('link');
                l.rel = 'stylesheet';
                l.href = url;
                l.setAttribute('data-font', t);
                document.head.appendChild(l);
            }
            function apply(t) {
                current = t;
                root.setAttribute('data-theme', t);
                root.style.backgroundColor = THEMES[t].bg;
                var meta = document.querySelector('meta[name="theme-color"]');
                if (meta) meta.setAttribute('content', THEMES[t].bg);
                loadFont(t);
            }

            // localStorage peut lever une exception (navigation privee, stockage bloque)
            var saved = null;
            try { saved = localStorage.getItem(KEY); } catch (e) { /* ignore */ }
            apply(valid(saved) ? saved : 'classique');

            return {
                list: function () { return Object.keys(THEMES); },
                current: function () { return current; },
                set: function (t) {
                    if (!valid(t)) return false; // liste blanche
                    apply(t);
                    try { localStorage.setItem(KEY, t); } catch (e) { /* ignore */ }
                    return true;
                }
            };
        })();
    </script>
    <!-- Tokens des 3 thèmes, composants et effets (n'utilisent que des var(--…)) -->
    <link rel="stylesheet" href="./shared/themes.css">
    <!-- Pas de SRI possible sur le Play CDN de Tailwind : cdn.tailwindcss.com sert un script
         généré dont le contenu change sans changement d'URL (aucune empreinte stable à épingler). -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Palette Tailwind REMPLACÉE (pas étendue) par des couleurs sémantiques branchées sur les
         tokens du thème : aucune classe slate-*, yellow-*... ne peut plus être générée. Les triplets
         RGB (--c-*) gardent l'opacité Tailwind (ex. text-accent/80). Rayons, ombres, polices,
         graisses, interlettrages, durées et courbes passent aussi par les tokens. -->
    <script>
        (function () {
            // CDN indisponible (hors ligne, bloqueur) : pas d'exception, themes.css garde la page lisible
            if (!window.tailwind) return;
            var c = function (name) { return 'rgb(var(--c-' + name + ') / <alpha-value>)'; };
            tailwind.config = {
                theme: {
                    colors: {
                        transparent: 'transparent',
                        current: 'currentColor',
                        inherit: 'inherit',
                        bg: c('bg'),
                        'bg-2': c('bg-2'),
                        surface: c('surface'),
                        'surface-2': c('surface-2'),
                        'surface-3': c('surface-3'),
                        border: c('border'),
                        'border-mid': c('border-mid'),
                        'border-strong': c('border-strong'),
                        text: c('text'),
                        'text-2': c('text-2'),
                        muted: c('muted'),
                        faint: c('faint'),
                        accent: c('accent'),
                        'accent-hover': c('accent-hover'),
                        'accent-press': c('accent-press'),
                        'on-accent': c('on-accent'),
                        'accent-2': c('accent-2'),
                        inverse: c('inverse'),
                        'on-inverse': c('on-inverse'),
                        danger: c('danger'),
                        'danger-text': c('danger-text'),
                        success: c('success'),
                        warning: c('warning'),
                        info: c('info')
                    },
                    borderRadius: {
                        none: '0',
                        sm: 'var(--r-sm)',
                        DEFAULT: 'var(--r-sm)',
                        md: 'var(--r-md)',
                        btn: 'var(--r-btn)',
                        lg: 'var(--r-lg)',
                        xl: 'var(--r-xl)',
                        full: '9999px'
                    },
                    boxShadow: {
                        none: 'none',
                        sm: 'var(--shadow-sm)',
                        lg: 'var(--shadow-lg)',
                        inner: 'var(--shadow-inset)',
                        accent: 'var(--shadow-accent)'
                    },
                    fontFamily: {
                        sans: ['var(--font-body)'],
                        display: ['var(--font-display)'],
                        mono: ['var(--font-mono)']
                    },
                    extend: {
                        fontWeight: { black: 'var(--fw-black)', bold: 'var(--fw-bold)' },
                        letterSpacing: { tighter: 'var(--tracking-display)', widest: 'var(--tracking-label)', wide2: 'var(--tracking-wide)' },
                        transitionDuration: { DEFAULT: 'var(--dur)', fast: 'var(--dur-fast)', slow: 'var(--dur-slow)' },
                        transitionTimingFunction: { DEFAULT: 'var(--ease)' }
                    }
                }
            };
        })();
    </script>
    <!-- Scripts tiers figés par version + SRI (sha384 du fichier exact) : un fichier modifié sur
         le CDN est refusé par le navigateur. Pour lucide, URL finale du fichier (unpkg redirige
         lucide@1.21.0 vers dist/umd/lucide.min.js) : l'empreinte porte sur un fichier fixe. -->
    <script src="https://unpkg.com/lucide@1.21.0/dist/umd/lucide.min.js" integrity="sha384-xphWpUp6pRlNpM8BxCtyoW96oteA0kPxUX0VP6V32gICuE4ViDFBfaoyj5BS7M4w" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" integrity="sha384-+mbV2IY1Zk/X1p/nWllGySJSUN8uMs+gUAN10Or95UBH0fpj6GfKgPmgC5EXieXG" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js" integrity="sha384-PlRSzpewlarQuj5alIadXwjNUX+2eNMKwr0f07ShWYLy8B6TjEbm7ZlcN/ScSbwy" crossorigin="anonymous"></script>
</head>
<body class="text-text min-h-screen p-4 sm:p-6 md:p-8 overflow-x-hidden">

         cliquable. Les couches .fx-1 à .fx-5 sont animées en transform (aucun repeint de la page). -->
    <div class="fx" aria-hidden="true"><span class="fx-1"></span><span class="fx-2"></span><span class="fx-3"></span><span class="fx-4"></span><span class="fx-5"></span></div>

    <!-- Contenu principal : passe en "inert" pendant qu'une modale est ouverte -->
    <div id="appRoot" class="above-fx w-full">
        <header class="panel p-6 sm:p-10 mb-10">

                </div>

                        <input type="text" id="id1" autocomplete="off" spellcheck="false" placeholder="ID Bitmoji 1" aria-label="ID Bitmoji de l'utilisateur 1"

                               class="w-full min-w-0 font-display text-accent-2 font-black text-3xl sm:text-4xl tracking-tighter leading-tight pb-1 placeholder:text-accent-2/80">
                        <input type="text" id="id2" autocomplete="off" spellcheck="false" placeholder="ID Bitmoji 2" aria-label="ID Bitmoji de l'utilisateur 2"
                               class="w-full min-w-0 text-text-2 text-sm font-mono border-t border-border-mid pt-3 placeholder:text-muted aria-[invalid=true]:text-danger aria-[invalid=true]:border-danger">

        <main id="main" tabindex="-1">

                    <button type="button" class="btn seg-btn is-swatch" data-theme-btn="neon" aria-pressed="false" title="Néon Arcade">

                    <button type="button" class="btn seg-btn is-swatch" data-theme-btn="cosmos" aria-pressed="false" title="Cosmos">

                    </span>
                </div>

                <!-- Catégorie : combobox ARIA maison (la datalist native n'était pas stylable) -->
                <div id="categoryCombo" class="field-wrap min-h-[60px] col-span-1 md:col-span-2 xl:col-span-1">
                    <input type="text" id="categoryInput" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="categoryListbox"
                           autocomplete="off" spellcheck="false" placeholder="Categorie..." aria-label="Filtrer par categorie"
                           class="field px-6 pr-12 [&:not(:placeholder-shown)]:pr-24 text-xs font-black tracking-widest cursor-text">
                    <button type="button" id="categoryClear" class="field-clear right-12" aria-label="Effacer la catégorie" hidden>
                        <i data-lucide="x" class="w-4 h-4" aria-hidden="true"></i>
                    </button>
                    <span class="field-icon right-5" aria-hidden="true">
                        <i data-lucide="filter" class="w-5 h-5" aria-hidden="true"></i>
                    </span>
                    <ul id="categoryListbox" role="listbox" aria-label="Catégories" class="combo-list" hidden></ul>
                </div>

                <div class="field-wrap col-span-2 md:col-span-3 xl:col-span-2 min-h-[60px]">
                    <span class="field-icon left-6" aria-hidden="true">
                        <i data-lucide="search" class="w-5 h-5" aria-hidden="true"></i>
                    </span>
                    <input type="search" id="search" autocomplete="off" spellcheck="false" placeholder="Rechercher (ex: sourire, amour)..." aria-label="Rechercher une pose"
                           class="field pl-14 pr-5 [&:not(:placeholder-shown)]:pr-14 font-bold text-sm placeholder:font-normal">
                    <button type="button" id="searchClear" class="field-clear right-4" aria-label="Effacer la recherche" hidden>

            <div id="grid-container">
                <!-- Etats "Aucun resultat" / erreur de chargement (avec bouton Reessayer) -->
                <div id="gridState" class="hidden text-center text-text-2 font-bold py-6"></div>
                <div id="grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 xl:grid-cols-8 2xl:grid-cols-10 gap-4 md:gap-6 lg:gap-8"></div>
            </div>

    <div id="helpLightbox" class="overlay fixed inset-0 z-50 hidden flex items-start justify-center overflow-y-auto p-4 sm:p-8">

    <!-- Zone d'annonce visible (copie, ZIP, erreurs) : remplace les alert().
         Jamais cliquable (pointer-events: none) : elle ne bloque pas la grille dessous. -->
    <div id="toast" role="status" aria-live="polite" aria-atomic="true" class="toast"></div>

    <!-- Un seul module : plus de globals implicites entre script classique et module
         (seule exception explicite : window.aeTheme, défini dans <head> pour éviter le flash) -->
    <script type="module">
        // Les modules partages sont charges dynamiquement pour pouvoir afficher un message
        // lisible si le chargement echoue (un import statique planterait sans rien dire).
        let I18N = null;
        let poseFileTags = null; // noms de fichiers des poses, doublons numerotes (public/shared/poseNameUtils.js)

        const $ = (id) => document.getElementById(id);

        const FLAGS = { fr:'🇫🇷', en:'🇬🇧', es:'🇪🇸', 'fr-ca':'🇨🇦', de:'🇩🇪', ja:'🇯🇵', ko:'🇰🇷', it:'🇮🇹', pt:'🇵🇹', zh:'🇨🇳', tr:'🇹🇷', pl:'🇵🇱', ro:'🇷🇴', el:'🇬🇷' };

        // Libelles traduits des themes (cles i18n)
        const THEME_LABELS = { classique: 'themeClassique', neon: 'themeNeon', cosmos: 'themeCosmos' };

        // Meme motif que l'API (functions/api/export.js) pour les IDs et les noms
        const SAFE_RE = /^[A-Za-z0-9_-]+$/;
        const DEFAULT_NAME_1 = 'Utilisateur1';
        const DEFAULT_NAME_2 = 'Utilisateur2';

        let rawData = { categories: [], imoji: [], friends: [] };
        let dataReady = false;
        let currentMode = 'solo';
        let currentRenderItems = [];
        let currentLang = 'en';
        let gridStateKind = null; // null | 'empty' | 'error'

        // Langue courante avec repli sur l'anglais (jamais de TypeError sur une cle inconnue)
        const tr = () => (I18N && I18N[currentLang]) ?? (I18N && I18N.en) ?? {};

        // --- Utilitaires -------------------------------------------------
        const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
        const debounce = (fn, ms) => {
            let h;
            return (...args) => { clearTimeout(h); h = setTimeout(() => fn(...args), ms); };
        };
        const icons = () => { try { window.lucide && window.lucide.createIcons(); } catch (e) { /* icones facultatives */ } };

        // localStorage peut lever une exception (navigation privee, stockage bloque)
        const store = {
            get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
            set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* ignore */ }
            }
        };

        function normalizeStr(str) {
            if (!str) return "";
            return str.toString()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .toLowerCase();
        }
        function escapeHtml(str) {
            if (!str) return "";
            return str.toString()
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // Un ID n'est accepte que s'il respecte le motif de l'API (sinon chaine vide)
        const validId = (v) => (typeof v === 'string' && SAFE_RE.test(v.trim()) ? v.trim() : '');
        // Nom de dossier/fichier sur : sans accents, caracteres hors motif remplaces par "_"
        function sanitizeName(v, fallback) {
            const s = String(v || '')
                .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                .replace(/[^A-Za-z0-9_-]+/g, '_')
                .replace(/^_+|_+$/g, '')
                .slice(0, 40);
            return SAFE_RE.test(s) ? s : fallback;
        }

        // Annonce visible + lue par les lecteurs d'ecran (role="status").
        // Entree/sortie en fondu (classe .toast, data-show) ; le texte est vide une fois masque.
        let toastTimer;
        function say(msg, isError = false) {
            const toast = $('toast');
            clearTimeout(toastTimer);
            toast.removeAttribute('data-show');
            toast.replaceChildren();
            toast.dataset.variant = isError ? 'error' : 'success';
            toastTimer = setTimeout(() => {
                const icon = document.createElement('i');
                icon.dataset.lucide = isError ? 'alert-triangle' : 'check';
                icon.className = 'toast-icon w-[18px] h-[18px]';
                icon.setAttribute('aria-hidden', 'true');
                const text = document.createElement('span');
                text.textContent = msg;
                toast.replaceChildren(icon, text);
                icons();
                toast.setAttribute('data-show', '');
                toastTimer = setTimeout(() => {
                    toast.removeAttribute('data-show');
                    toastTimer = setTimeout(() => { toast.replaceChildren(); }, 400);
                }, 7000);
            }, 60);
        }

        function setStats(text) { $('stats').textContent = text; }

        // --- Langue ------------------------------------------------------
        const hasLang = (l) => !!I18N && Object.prototype.hasOwnProperty.call(I18N, l);

        // Detection : correspondance exacte (fr-ca), puis prefixe (fr), puis anglais
        function detectLang() {
            const prefs = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
            for (const raw of prefs) {
                const l = String(raw || '').toLowerCase();
                if (hasLang(l)) return l;
                const base = l.split('-')[0];
                if (hasLang(base)) return base;
            }
            return 'en';
        }

        // fr-ca -> fr-CA (BCP 47)
        const toBcp47 = (l) => l.replace(/-([a-z]{2})$/i, (m, r) => '-' + r.toUpperCase());

        // --- Boutons : etats "repos" -------------------------------------
        // Les classes visuelles sont dans le HTML (et themes.css) ; les etats passent par
        // des attributs : aria-disabled, aria-busy, data-state="busy|success|error".
        function renderZipBtnIdle() {
            const btn = $('zipBtn');
            btn.innerHTML = `<i data-lucide="folder-archive" class="w-7 h-7" aria-hidden="true"></i> ${escapeHtml(tr().zipBtn)}`;
        }
        function renderCopyBtnIdle() {
            const btn = $('copyBtn');
            btn.innerHTML = `<i data-lucide="copy" class="w-5 h-5 group-hover:scale-110 transition-transform" aria-hidden="true"></i> ${escapeHtml(tr().copyBtnText)}`;
            btn.removeAttribute('data-state');
            btn.removeAttribute('aria-disabled');
        }
        function renderSaveBtnIdle() {
            const btn = $('singleDlBtn');
            btn.innerHTML = `<i data-lucide="download" class="w-5 h-5 group-hover:translate-y-1 transition-transform" aria-hidden="true"></i> ${escapeHtml(tr().saveBtnText)}`;
            btn.removeAttribute('data-state');
            btn.removeAttribute('aria-disabled');
        }

        function renderModeButtons() {
            const t = tr();
            const isS = currentMode === 'solo';
            $('btn-solo').setAttribute('aria-pressed', String(isS));
            $('btn-duo').setAttribute('aria-pressed', String(!isS));
            $('btn-solo').textContent = t.modeSolo;
            $('btn-duo').textContent = t.modeDuo;
        }

        // --- Theme -------------------------------------------------------
        const themeApi = window.aeTheme || null;

        function renderThemeButtons() {
            const t = tr();
            const cur = themeApi ? themeApi.current() : 'classique';
            document.querySelectorAll('[data-theme-btn]').forEach((btn) => {
                const name = btn.dataset.themeBtn;
                const label = t[THEME_LABELS[name]] || name;
                btn.setAttribute('aria-pressed', String(name === cur));
                btn.title = label;
                btn.querySelector('.sr-only').textContent = label;
            });
        }

        function changeTheme(name) {
            if (!themeApi || !themeApi.set(name)) return; // liste blanche dans aeTheme.set
            renderThemeButtons();
        }

        function applyTranslations(lang) {
            currentLang = hasLang(lang) ? lang : 'en';
            const t = tr();
            document.documentElement.lang = toBcp47(currentLang);
            document.title = t.pageTitle;

            $('skipLink').textContent = t.skipLink;
            setStats(t.statsInit);

            $('name1').placeholder = t.name1Placeholder;
            $('name1').setAttribute('aria-label', t.name1Aria);
            $('id1').placeholder = t.id1Placeholder;
            $('id1').setAttribute('aria-label', t.id1Aria);
            $('swapBtn').setAttribute('aria-label', t.swapAria);
            $('name2').placeholder = t.name2Placeholder;
            $('name2').setAttribute('aria-label', t.name2Aria);
            $('id2').placeholder = t.id2Placeholder;
            $('id2').setAttribute('aria-label', t.id2Aria);

            $('helpBtn').setAttribute('title', t.helpAria);
            $('helpBtn').setAttribute('aria-label', t.helpAria);

            $('filters').setAttribute('aria-label', t.filtersAria);
            $('modeGroup').setAttribute('aria-label', t.modeAria);
            $('langSelect').setAttribute('aria-label', t.langAria);
            $('scaleSelect').setAttribute('aria-label', t.scaleAria);
            $('themeGroup').setAttribute('aria-label', t.themeAria);
            renderModeButtons();
            renderThemeButtons();

            $('categoryInput').placeholder = t.categoryPlaceholder;
            $('categoryInput').setAttribute('aria-label', t.categoryAria);
            $('categoryListbox').setAttribute('aria-label', t.categoryListAria);
            $('categoryClear').setAttribute('aria-label', t.clearCategoryAria);
            $('search').placeholder = t.searchPlaceholder;
            $('search').setAttribute('aria-label', t.searchAria);
            $('searchClear').setAttribute('aria-label', t.clearSearchAria);
            if (combo.open) renderComboList();

            $('helpCloseBtn').setAttribute('aria-label', t.helpCloseAria);
            $('helpTitleText').textContent = t.helpTitle;

            $('lightboxCloseBtn').setAttribute('aria-label', t.lightboxCloseAria);
            $('lightbox-title').textContent = t.lightboxDefaultTitle;
            $('lightbox-res').textContent = t.lightboxDefaultRes;

            if (!zipBusy) renderZipBtnIdle();
            if (!copyBusy) renderCopyBtnIdle();
            if (!saveBusy) renderSaveBtnIdle();
            if (gridStateKind) showGridState(gridStateKind);

            icons();
        }

        // --- Chargement du catalogue -------------------------------------
        let loadSeq = 0;
        let loadCtrl = null;

        // Meme regle que l'API (SRC_PATTERN de functions/api/export.js) : seul le CDN Bitmoji est
        // accepte, avec un jeu de caracteres sans guillemet, espace ni caractere de controle.
        const SRC_RE = /^https:\/\/sdk\.bitmoji\.com\/[A-Za-z0-9_\-\/.%]+$/;

        // Prepare les items une seule fois : mots-cles normalises (evite de les recalculer a
        // chaque frappe) et nom de fichier _file (tag nettoye + suffixe _2, _3... des doublons).
        // _file est calcule sur la liste COMPLETE, avant tout filtrage, avec la meme fonction que
        // l'API (poseFileTags) : un item ecarte ne decale pas la numerotation des suivants, et le
        // ZIP, ses metadata et la lightbox portent les memes noms que le script /api/export.
        function prepareItems(list) {
            if (!Array.isArray(list)) throw new Error('Catalogue invalide');
            const files = poseFileTags(list);
            const items = [];
            list.forEach((it, i) => {
                if (!it || typeof it.src !== 'string' || !SRC_RE.test(it.src)) return;
                const categories = (Array.isArray(it.categories) ? it.categories : [])
                    .map((c) => (typeof c === 'string' ? c : (c && c.name) || ''))
                    .filter(Boolean);
                items.push({
                    ...it,
                    displayTag: String(it.displayTag ?? ''),
                    categories,
                    _file: files[i],
                    _kw: normalizeStr(it.keywords),
                    _cats: categories.map(normalizeStr)
                });
            });
            return items;
        }

        async function loadData(lang) {
            const seq = ++loadSeq;
            if (loadCtrl) loadCtrl.abort();
            loadCtrl = new AbortController();
            showGridState(null);
            try {
                const response = await fetch(`./templates_${lang}.json`, { signal: loadCtrl.signal });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const json = await response.json();
                if (seq !== loadSeq) return; // une langue plus recente a ete demandee entre-temps

                const data = {
                    categories: json.categories || [],
                    imoji: prepareItems(json.imoji),
                    friends: prepareItems(json.friends)
                };
                rawData = data;
                dataReady = true;

                const categoriesMap = new Map();
                [...data.imoji, ...data.friends].forEach((item) => {
                    item.categories.forEach((catName) => categoriesMap.set(normalizeStr(catName), catName));
                });

                // Options de la combobox : memes valeurs (MAJUSCULES) et meme tri que l'ancienne datalist
                categoryOptions = Array.from(categoriesMap.keys()).sort()
                    .map((normCat) => categoriesMap.get(normCat).toUpperCase());
                if (combo.open) renderComboList();

                setMode(currentMode);
            } catch (err) {
                if ((err && err.name === 'AbortError') || seq !== loadSeq) return;
                console.error(err);
                dataReady = false;
                currentRenderItems = [];
                categoryOptions = [];
                $('grid').replaceChildren();
                setStats(tr().statsError);
                showGridState('error');
            }
        }

        // Etat "Aucun resultat" (avec bouton Effacer les filtres) ou erreur (avec bouton Reessayer)
        function showGridState(kind) {
            gridStateKind = kind;
            const box = $('gridState');
            box.replaceChildren();
            box.removeAttribute('role');
            if (!kind) { box.classList.add('hidden'); return; }
            const t = tr();
            const p = document.createElement('p');
            if (kind === 'error') {
                box.setAttribute('role', 'alert');
                p.textContent = t.statsError;
                p.className = 'text-danger mb-6';
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.id = 'retryBtn';
                btn.className = 'btn btn-primary btn-pill px-8 py-4 font-black text-sm';
                btn.textContent = t.retryBtn;
                btn.addEventListener('click', () => { setStats(tr().statsInit); loadData(currentLang); });
                box.append(p, btn);
            } else {
                p.textContent = t.noResults;
                box.append(p);
                if ($('search').value || $('categoryInput').value) {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'btn btn-ghost mt-4 px-6 py-3 text-xs font-black tracking-widest uppercase';
                    btn.textContent = t.clearFiltersBtn;
                    btn.addEventListener('click', clearFilters);
                    box.append(btn);
                }
            }
            box.classList.remove('hidden');
        }

        // --- Modales (aide, apercu) --------------------------------------
        let activeModal = null;
        let lastTrigger = null;
        const FOCUSABLE = 'button:not([disabled]), [href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';

        function openModal(overlay, focusEl, trigger) {
            closeCombo();
            lastTrigger = trigger || document.activeElement;
            activeModal = overlay;
            overlay.classList.remove('hidden');
            $('appRoot').inert = true; // le contenu principal n'est plus atteignable
            document.body.classList.add('overflow-hidden');
            (focusEl || overlay).focus();
        }
        function closeModal(overlay) {
            if (!overlay || overlay.classList.contains('hidden')) return;
            overlay.classList.add('hidden');
            if (activeModal === overlay) activeModal = null;
            $('appRoot').inert = false;
            document.body.classList.remove('overflow-hidden');
            const back = lastTrigger && lastTrigger.isConnected ? lastTrigger : $('search');
            lastTrigger = null;
            back.focus();
        }

        document.addEventListener('keydown', (e) => {
            if (!activeModal) return;
            if (e.key === 'Escape') {
                e.preventDefault();
                closeModal(activeModal);
            } else if (e.key === 'Tab') {
                // Piege de focus : on reste dans la modale
                const items = Array.from(activeModal.querySelectorAll(FOCUSABLE))
                    .filter((el) => el.getAttribute('aria-disabled') !== 'true' && el.offsetParent !== null);
                if (!items.length) { e.preventDefault(); return; }
                const first = items[0], last = items[items.length - 1];
                if (!activeModal.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
                else if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
                else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
            }
        });

        // --- Modale d'aide ------------------------------------------------
        let helpSeq = 0;
        const num = (v) => (Number.isFinite(Number(v)) ? String(Number(v)) : '?');

        async function openHelp() {
            const seq = ++helpSeq;
            const t = tr();
            const helpContent = $('helpContent');
            helpContent.innerHTML = `<div class="flex items-center gap-3 text-muted animate-pulse"><i data-lucide="loader-2" class="w-5 h-5 animate-spin" aria-hidden="true"></i> ${escapeHtml(t.helpLoading)}</div>`;
            icons();
            openModal($('helpLightbox'), $('helpCloseBtn'), $('helpBtn'));

            try {
                const res = await fetch('./aide.json');
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const aideDonnees = await res.json();
                if (seq !== helpSeq) return;
                const stats = (aideDonnees.stats && (aideDonnees.stats[currentLang] || aideDonnees.stats.en)) || {};
                const guide = (aideDonnees.guide && (aideDonnees.guide[currentLang] || aideDonnees.guide.en)) || "";
                const flag = FLAGS[currentLang] || '';

                // Formater l'affichage avec le JSON (tout est echappe ou converti en nombre)
                helpContent.innerHTML = `
                    <div class="panel-sunken p-6 mb-8">
                        <h4 class="text-xs font-black tracking-widest text-muted mb-2">${escapeHtml(t.catalogLabel)} ${flag}</h4>
                        <p class="text-2xl font-black text-text">${num(stats.solo)} <span class="text-sm font-normal text-muted">${escapeHtml(t.modeSolo)}</span></p>
                        <p class="text-2xl font-black text-text">${num(stats.duo)} <span class="text-sm font-normal text-muted">${escapeHtml(t.modeDuo)}</span></p>
                    </div>

                    <div class="panel-info p-6">
                        <h4 class="text-xs font-black tracking-widest text-info mb-4 uppercase">${escapeHtml(t.helpGuideTitle)}</h4>
                        <p class="text-text-2 leading-relaxed whitespace-pre-line">${escapeHtml(guide)}</p>
                    </div>

                    <div class="text-center mt-6">
                        <p class="text-xs font-black tracking-wide2 text-muted uppercase">${escapeHtml(t.helpLastUpdate)} ${escapeHtml(aideDonnees.date_maj)}</p>
                    </div>
                `;
            } catch (e) {
                if (seq !== helpSeq) return;
                console.error(e);
                helpContent.innerHTML = `
                    <div class="panel-danger p-6" role="alert">
                        <p><i data-lucide="alert-triangle" class="inline w-5 h-5 mr-2 text-danger" aria-hidden="true"></i> ${escapeHtml(t.helpErrorTitle)} <strong>aide.json</strong>.</p>
                        <p class="text-sm mt-2">${escapeHtml(t.helpErrorSubtitle)}</p>
                    </div>
                `;
            }
            icons();
        }

        function closeHelp() { closeModal($('helpLightbox')); }
        // -----------------------------------

        // --- Champs et persistance ---------------------------------------
        const idState = { id1: true, id2: true }; // dernier etat de validite (evite de repeter l'annonce)

        // Etat d'erreur porte par le champ (aria-invalid) ET par toute la carte utilisateur
        function setIdInvalid(el, bad) {
            el.setAttribute('aria-invalid', String(bad));
            const card = el.closest('.ucard');
            if (card) card.toggleAttribute('data-invalid', bad);
        }

        function checkIdField(el) {
            const raw = el.value.trim();
            const bad = raw !== '' && !SAFE_RE.test(raw);
            setIdInvalid(el, bad);
            if (bad && idState[el.id]) say(tr().invalidIdMsg, true);
            idState[el.id] = !bad;
            return bad;
        }

        function changeLanguage() {
            const lang = $('langSelect').value;
            if (!hasLang(lang)) return;
            store.set('bt_lang', lang);
            applyTranslations(lang);
            loadData(lang);
        }

        function save() {
            store.set('bt_id1', validId($('id1').value));
            store.set('bt_id2', validId($('id2').value));
            store.set('bt_name1', $('name1').value);
            store.set('bt_name2', $('name2').value);
        }

        function onIdInput(e) {
            checkIdField(e.currentTarget);
            save();
            render();
        }

        function swapIds() {
            const i1 = $('id1'), i2 = $('id2');
            const n1 = $('name1'), n2 = $('name2');
            [i1.value, i2.value] = [i2.value, i1.value];
            [n1.value, n2.value] = [n2.value, n1.value];
            checkIdField(i1); checkIdField(i2);
            save();
            render();
        }

        function setMode(mode) {
            currentMode = mode;
            renderModeButtons();
            // Efface un marquage "ID manquant" posé par le clic ZIP (le besoin depend du mode)
            checkIdField($('id1')); checkIdField($('id2'));

            const container = $('grid-container');
            container.classList.remove('animate-mode-switch');
            void container.offsetWidth;
            container.classList.add('animate-mode-switch');

            render();
        }

        // Filtre commun a la grille et au ZIP (utilise les champs pre-calcules)
        function filterItems(list) {
            const search = normalizeStr($('search').value);
            const category = normalizeStr($('categoryInput').value);
            return list.filter((t) => t._kw.includes(search) && (category === '' || t._cats.some((c) => c.includes(category))));
        }

        function render() {
            const grid = $('grid');
            if (!dataReady) { grid.replaceChildren(); return; }
            const scale = $('scaleSelect').value;
            // ID absent ou invalide : on garde le marqueur "%s" (les images seront en erreur)
            const id1 = validId($('id1').value) || "%s", id2 = validId($('id2').value) || "%s";

            const list = currentMode === 'solo' ? rawData.imoji : rawData.friends;
            const filtered = filterItems(list);

            // On garde les items rendus de cote (par index) plutot que d'injecter leurs
            // donnees dans des attributs onclick : le clic est gere par un listener delegue.
            currentRenderItems = filtered.map((t) => {
                let url = t.src.replace('%s', id1);
                if (url.includes('%s')) url = url.replace('%s', id2);
                url += `?transparent=1&palette=1&scale=${scale}`;
                return { url, title: t.displayTag || t.slugFallback || '', file: t._file };
            });

            // Le span nomme deja le bouton : l'image est decorative (alt vide).
            // Image en erreur : data-broken pose par l'ecouteur "error" delegue (silhouette thematisee).
            grid.innerHTML = currentRenderItems.map((item, i) => `
                <button type="button" data-i="${i}" title="${escapeHtml(item.title)}" class="grid-item card p-5">
                    <span class="card-art mb-5" aria-hidden="true"><img src="${escapeHtml(item.url)}" alt="" loading="lazy" decoding="async"></span>
                    <span class="text-xs uppercase font-black tracking-widest block truncate">${escapeHtml(item.title)}</span>
                </button>`).join('');

            setStats(`${currentRenderItems.length} ${tr().statsSuffix}`);
            showGridState(currentRenderItems.length === 0 ? 'empty' : null);
        }
        const renderDebounced = debounce(render, 180);

        // --- Boutons "Effacer" (recherche, categorie) ----------------------
        function syncClearButtons() {
            $('searchClear').hidden = $('search').value === '';
            $('categoryClear').hidden = $('categoryInput').value === '';
        }
        function clearField(input) {
            input.value = '';
            syncClearButtons();
            closeCombo();
            render();
            input.focus();
        }
        function clearFilters() {
            $('search').value = '';
            $('categoryInput').value = '';
            syncClearButtons();
            closeCombo();
            render();
            $('search').focus();
        }

        // --- Combobox des categories (remplace la datalist native, non stylable) ---
        // Motif WAI-ARIA "combobox avec liste et autocompletion" : le focus reste dans le champ,
        // l'option active est designee par aria-activedescendant.
        let categoryOptions = []; // libelles affiches (MAJUSCULES), tries comme l'ancienne datalist
        const combo = { open: false, active: -1, items: [] };

        // Filtrage insensible aux accents et a la casse (meme normalisation que la grille)
        function comboMatches() {
            const q = normalizeStr($('categoryInput').value);
            return q ? categoryOptions.filter((label) => normalizeStr(label).includes(q)) : categoryOptions.slice();
        }

        // Options construites via le DOM (textContent) : aucun HTML injecte
        function renderComboList() {
            const list = $('categoryListbox');
            combo.items = comboMatches();
            if (combo.active >= combo.items.length) combo.active = -1;
            const frag = document.createDocumentFragment();
            if (!combo.items.length) {
                const li = document.createElement('li');
                li.id = 'cat-opt-none';
                li.className = 'combo-option';
                li.setAttribute('role', 'option');
                li.setAttribute('aria-disabled', 'true');
                li.setAttribute('aria-selected', 'false');
                li.textContent = tr().categoryNone;
                frag.appendChild(li);
            } else {
                combo.items.forEach((label, i) => {
                    const li = document.createElement('li');
                    li.id = `cat-opt-${i}`;
                    li.className = 'combo-option';
                    li.setAttribute('role', 'option');
                    li.setAttribute('aria-selected', String(i === combo.active));
                    li.dataset.i = String(i);
                    li.textContent = label;
                    frag.appendChild(li);
                });
            }
            list.replaceChildren(frag);
            syncActiveOption();
        }

        function syncActiveOption() {
            const input = $('categoryInput');
            const list = $('categoryListbox');
            list.querySelectorAll('[aria-selected="true"]').forEach((el) => el.setAttribute('aria-selected', 'false'));
            const el = combo.active >= 0 ? $(`cat-opt-${combo.active}`) : null;
            if (el) {
                el.setAttribute('aria-selected', 'true');
                input.setAttribute('aria-activedescendant', el.id);
                el.scrollIntoView({ block: 'nearest' });
            } else {
                input.removeAttribute('aria-activedescendant');
            }
        }

        function openCombo() {
            if (combo.open) return;
            combo.open = true;
            combo.active = -1;
            renderComboList();
            $('categoryListbox').hidden = false;
            $('categoryInput').setAttribute('aria-expanded', 'true');
        }
        function closeCombo() {
            if (!combo.open) return;
            combo.open = false;
            combo.active = -1;
            $('categoryListbox').hidden = true;
            $('categoryInput').setAttribute('aria-expanded', 'false');
            $('categoryInput').removeAttribute('aria-activedescendant');
        }
        function moveActive(delta) {
            const n = combo.items.length;
            if (!n) return;
            combo.active = combo.active < 0
                ? (delta > 0 ? 0 : n - 1)
                : (combo.active + delta + n) % n;
            syncActiveOption();
        }
        // Choix d'une option : meme valeur que la datalist (MAJUSCULES), meme filtrage de la grille
        function chooseCategory(i) {
            const label = combo.items[i];
            if (label === undefined) return;
            $('categoryInput').value = label;
            closeCombo();
            syncClearButtons();
            render();
        }

        function onComboKeydown(e) {
            if (e.isComposing || e.keyCode === 229) return; // composition IME en cours (ja, ko, zh)
            if (e.altKey && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
            switch (e.key) {
                case 'ArrowDown':
                    e.preventDefault();
                    if (!combo.open) { openCombo(); if (!e.altKey) moveActive(1); }
                    else moveActive(1);
                    break;
                case 'ArrowUp':
                    e.preventDefault();
                    if (!combo.open) { openCombo(); if (!e.altKey) moveActive(-1); }
                    else moveActive(-1);
                    break;
                case 'Enter':
                    if (combo.open) {
                        e.preventDefault();
                        if (combo.active >= 0) chooseCategory(combo.active);
                        else closeCombo();
                    }
                    break;
                case 'Escape':
                    // Liste ouverte : on la ferme ; sinon on vide le champ (comme un champ de recherche)
                    if (combo.open) { e.preventDefault(); closeCombo(); }
                    else if (e.currentTarget.value) { e.preventDefault(); clearField(e.currentTarget); }
                    break;
                case 'Tab':
                    closeCombo(); // on laisse le focus sortir
                    break;
                default:
                    break;
            }
        }

        function wireCombo() {
            const input = $('categoryInput');
            const list = $('categoryListbox');
            input.addEventListener('keydown', onComboKeydown);
            input.addEventListener('input', () => {
                combo.active = -1;
                if (combo.open) renderComboList(); else openCombo();
                syncClearButtons();
                renderDebounced();
            });
            input.addEventListener('click', openCombo);
            input.addEventListener('blur', closeCombo);
            // mousedown annule : le champ garde le focus (pas de blur) pendant le clic d'une option
            list.addEventListener('mousedown', (e) => e.preventDefault());
            list.addEventListener('click', (e) => {
                const opt = e.target.closest('[role="option"][data-i]');
                if (opt) chooseCategory(Number(opt.dataset.i));
            });
            // Clic hors de la combobox : fermeture
            document.addEventListener('pointerdown', (e) => {
                if (combo.open && !$('categoryCombo').contains(e.target)) closeCombo();
            });
        }

        function openLightboxByIndex(i, trigger) {
            const item = currentRenderItems[i];
            if (!item) return;
            openLightbox(item.url, item.title, item.file, trigger);
        }

        // --- Telechargement / copie d'une image --------------------------
        async function fetchBlob(url) {
            const response = await fetch(url);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return response.blob();
        }

        let saveBusy = false;
        async function forceDownload(url, filename) {
            if (saveBusy) return;
            saveBusy = true;
            const btn = $('singleDlBtn');
            // Desactive pendant le telechargement (aria-disabled garde le focus clavier sur le bouton)
            btn.setAttribute('aria-disabled', 'true');
            btn.dataset.state = 'busy';
            btn.innerHTML = `<i data-lucide="loader-2" class="w-5 h-5 animate-spin" aria-hidden="true"></i>...`;
            icons();

            try {
                const blob = await fetchBlob(url);
                saveAs(blob, filename);
            } catch (e) {
                console.error(e);
                say(tr().downloadError, true);
            } finally {
                saveBusy = false;
                renderSaveBtnIdle();
                icons();
            }
        }

        let copyBusy = false;
        async function copyImage(url) {
            if (copyBusy) return;
            copyBusy = true;
            const btn = $('copyBtn');
            const t = tr();
            btn.setAttribute('aria-disabled', 'true');
            btn.dataset.state = 'busy';

            // Animation de chargement
            btn.innerHTML = `<i data-lucide="loader-2" class="w-5 h-5 animate-spin" aria-hidden="true"></i> ${escapeHtml(t.copyInProgress)}`;
            icons();

            try {
                // On telecharge l'image en memoire
                const blob = await fetchBlob(url);
                const png = blob.type === 'image/png' ? blob : new Blob([blob], { type: 'image/png' });

                // On ecrit le fichier PNG directement dans le presse-papier
                await navigator.clipboard.write([new ClipboardItem({ 'image/png': png })]);

                // Etat de succes (tokens success via data-state)
                btn.innerHTML = `<i data-lucide="check" class="w-5 h-5 icon-ok" aria-hidden="true"></i> ${escapeHtml(t.copiedSuccess)}`;
                btn.dataset.state = 'success';
                say(t.copiedSuccess);
            } catch (e) {
                console.error("Erreur de copie :", e);
                // Etat d'erreur (si le navigateur bloque l'acces)
                btn.innerHTML = `<i data-lucide="x" class="w-5 h-5 icon-ko" aria-hidden="true"></i> ${escapeHtml(t.copyError)}`;
                btn.dataset.state = 'error';
                say(t.copyError, true);
            } finally {
                icons();
                // Au bout de 2 secondes, on remet le bouton a son etat normal
                setTimeout(() => {
                    copyBusy = false;
                    renderCopyBtnIdle();
                    icons();
                }, 2000);
            }
        }

        let lightboxState = null;
        function openLightbox(url, title, file, trigger) {
            const scale = $('scaleSelect').value;
            const t = tr();
            $('lightboxHalo').removeAttribute('data-broken');
            $('lightbox-img').src = url;
            $('lightbox-img').alt = ''; // le titre juste en dessous nomme deja l'image
            $('lightbox-title').textContent = title;
            $('lightbox-res').textContent = `${t.lightboxResFormat} ${scale}X`;

            const n1 = sanitizeName($('name1').value, DEFAULT_NAME_1);
            const n2 = sanitizeName($('name2').value, DEFAULT_NAME_2);

            // file = nom de pose nettoye + suffixe de doublon, calcule dans prepareItems (meme nom que l'API)
            // Solo : Nom1__nom_de_la_pose.png / Duo : Nom1__Nom2__nom_de_la_pose.png
            const filename = currentMode === 'solo'
                ? `${n1}__${file}.png`
                : `${n1}__${n2}__${file}.png`;

            lightboxState = { url, filename };
            openModal($('lightbox'), $('lightboxCloseBtn'), trigger);
            icons();
        }

        function closeLightbox() { closeModal($('lightbox')); }

        // --- Export ZIP -------------------------------------------------
        let zipBusy = false;

        // 1 tentative + 1 nouvelle tentative par image
        async function fetchBlobRetry(url) {
            try {
                return await fetchBlob(url);
            } catch (e) {
                await sleep(400);
                return fetchBlob(url);
            }
        }

        async function downloadAllAsZip() {
            if (zipBusy) return;
            const t = tr();
            if (!window.JSZip || !window.saveAs) { say(t.downloadError, true); return; }

            const id1 = validId($('id1').value), id2 = validId($('id2').value);
            const bad1 = checkIdField($('id1')), bad2 = checkIdField($('id2'));
            if (bad1 || bad2) { say(t.invalidIdMsg, true); return; }
            if (!id1 || (currentMode === 'duo' && !id2)) {
                // Champ(s) manquant(s) marques comme un ID invalide (champ + carte), focus sur le premier
                const missing = [];
                if (!id1) missing.push($('id1'));
                if (currentMode === 'duo' && !id2) missing.push($('id2'));
                missing.forEach((el) => setIdInvalid(el, true));
                missing[0].focus();
                say(t.zipMissingIds, true);
                return;
            }

            const n1 = sanitizeName($('name1').value, DEFAULT_NAME_1);
            const n2 = sanitizeName($('name2').value, DEFAULT_NAME_2);
            const withUser2 = currentMode === 'duo' || !!id2;
            // Deux noms identiques ecraseraient les fichiers (meme dossier / meme nom)
            if (withUser2 && n1 === n2) { say(t.zipSameNames, true); return; }

            const scale = $('scaleSelect').value;
            const filteredList = filterItems(currentMode === 'solo' ? rawData.imoji : rawData.friends);
            if (!filteredList.length) { say(t.noResults, true); return; }

            zipBusy = true;
            const btn = $('zipBtn');
            btn.setAttribute('aria-disabled', 'true');
            btn.setAttribute('aria-busy', 'true');

            try {
                const zip = new JSZip();
                const qs = `?transparent=1&palette=1&scale=${scale}`;

                // ETAPE 1 : Preparer les taches (chaque tache garde sa fiche de metadonnees)
                // Noms de fichiers : item._file, numerote sur le catalogue COMPLET (prepareItems),
                // donc identiques a /api/export meme quand un filtre de recherche est actif.
                const tasks = [];

                for (const item of filteredList) {
                    const file = item._file;

                    const imgData = {
                        titre: item.displayTag,
                        mots_cles: item.keywords,
                        categories: item.categories || []
                    };

                    if (currentMode === 'solo') {
                        // Pour l'utilisateur 1
                        const filename1 = `${n1}__${file}.png`;
                        tasks.push({ url: item.src.replace('%s', id1) + qs, dir: n1, filename: filename1, group: 'u1', meta: { fichier: filename1, ...imgData } });

                        // Pour l'utilisateur 2 (uniquement s'il y a un ID : pas de dossier vide)
                        if (id2) {
                            const filename2 = `${n2}__${file}.png`;
                            tasks.push({ url: item.src.replace('%s', id2) + qs, dir: n2, filename: filename2, group: 'u2', meta: { fichier: filename2, ...imgData } });
                        }
                    } else {
                        // MODE DUO : ON FAIT LES DEUX SENS !
                        // Sens 1 : Utilisateur 1 d'abord, Utilisateur 2 ensuite
                        let url1 = item.src.replace('%s', id1);
                        if (url1.includes('%s')) url1 = url1.replace('%s', id2);
                        const filenameDuo1 = `${n1}__${n2}__${file}.png`;
                        tasks.push({ url: url1 + qs, dir: null, filename: filenameDuo1, group: 'duo', meta: { fichier: filenameDuo1, ...imgData } });

                        // Sens 2 : Utilisateur 2 d'abord, Utilisateur 1 ensuite (Inversion)
                        let url2 = item.src.replace('%s', id2);
                        if (url2.includes('%s')) url2 = url2.replace('%s', id1);
                        const filenameDuo2 = `${n2}__${n1}__${file}.png`;
                        tasks.push({ url: url2 + qs, dir: null, filename: filenameDuo2, group: 'duo', meta: { fichier: filenameDuo2, ...imgData } });
                    }
                }

                // ETAPE 2 : Lancer les telechargements en parallele (par lots de 15)
                const BATCH_SIZE = 15;
                let completed = 0;

                for (let i = 0; i < tasks.length; i += BATCH_SIZE) {
                    const batch = tasks.slice(i, i + BATCH_SIZE);

                    btn.innerHTML = `<i data-lucide="loader-2" class="w-7 h-7 animate-spin" aria-hidden="true"></i> ${completed} / ${tasks.length}`;
                    icons();

                    await Promise.all(batch.map(async (task) => {
                        try {
                            const blob = await fetchBlobRetry(task.url);
                            // Les dossiers sont crees a la demande : jamais de dossier vide
                            (task.dir ? zip.folder(task.dir) : zip).file(task.filename, blob);
                            task.ok = true;
                        } catch (e) {
                            task.ok = false;
                            console.warn(`Erreur sur l'image ${task.filename}`);
                        }
                    }));

                    completed += batch.length;
                }

                const okTasks = tasks.filter((x) => x.ok);
                const failures = tasks.length - okTasks.length;
                if (okTasks.length === 0) { say(t.zipNothing, true); return; }

                // ETAPE 3 : Creation finale du ZIP (metadonnees = images reussies uniquement)
                btn.innerHTML = `<i data-lucide="loader-2" class="w-7 h-7 animate-spin" aria-hidden="true"></i> ${escapeHtml(tr().zipCompressing)}`;
                icons();

                const metaOf = (g) => okTasks.filter((x) => x.group === g).map((x) => x.meta);
                const meta1 = metaOf('u1'), meta2 = metaOf('u2'), metaDuo = metaOf('duo');
                if (meta1.length) zip.folder(n1).file(`metadata_${n1}.json`, JSON.stringify(meta1, null, 2));
                if (meta2.length) zip.folder(n2).file(`metadata_${n2}.json`, JSON.stringify(meta2, null, 2));
                // Fichier au nom exact attendu par Home Assistant
                if (metaDuo.length) zip.file(`metadata_Duo.json`, JSON.stringify(metaDuo, null, 2));

                const content = await zip.generateAsync({ type: "blob" });
                saveAs(content, `AvatarExplorer__${currentMode === 'solo' ? n1 : 'Duo'}.zip`);

                const tNow = tr();
                if (failures > 0) say(tNow.zipPartial.replace('{n}', String(failures)), true);
                else say(tNow.zipDone);
            } catch (e) {
                console.error(e);
                say(tr().downloadError, true);
            } finally {
                // Remise a zero : le bouton ne reste jamais bloque
                zipBusy = false;
                btn.removeAttribute('aria-disabled');
                btn.removeAttribute('aria-busy');
                renderZipBtnIdle();
                icons();
            }
        }

        // --- Demarrage ---------------------------------------------------
        function showFatal() {
            const fr = (navigator.language || '').toLowerCase().startsWith('fr');
            const box = $('fatalError');
            box.textContent = fr
                ? "Impossible de charger les fichiers de l'application (traductions ou utilitaires). Vérifiez votre connexion puis "
                : "Unable to load the application files (translations or utilities). Check your connection, then ";
            const a = document.createElement('a');
            a.href = location.pathname;
            a.className = 'underline text-accent-hover';
            a.textContent = fr ? "rechargez la page." : "reload the page.";
            box.appendChild(a);
            box.classList.remove('hidden');
        }

        function wireEvents() {
            $('name1').addEventListener('input', save);
            $('name2').addEventListener('input', save);
            $('id1').addEventListener('input', onIdInput);
            $('id2').addEventListener('input', onIdInput);
            $('swapBtn').addEventListener('click', swapIds);
            $('zipBtn').addEventListener('click', downloadAllAsZip);
            $('helpBtn').addEventListener('click', openHelp);
            $('btn-solo').addEventListener('click', () => setMode('solo'));
            $('btn-duo').addEventListener('click', () => setMode('duo'));
            $('langSelect').addEventListener('change', changeLanguage);
            $('scaleSelect').addEventListener('change', render);
            $('search').addEventListener('input', () => { syncClearButtons(); renderDebounced(); });
            $('searchClear').addEventListener('click', () => clearField($('search')));
            $('categoryClear').addEventListener('click', () => clearField($('categoryInput')));
            wireCombo();

            // Selecteur de theme
            document.querySelectorAll('[data-theme-btn]').forEach((btn) => {
                btn.addEventListener('click', () => changeTheme(btn.dataset.themeBtn));
            });

            // Clic delegue sur les cartes de la grille
            $('grid').addEventListener('click', (e) => {
                const card = e.target.closest('.grid-item');
                if (card) openLightboxByIndex(Number(card.dataset.i), card);
            });
            // Image en erreur : "error" ne remonte pas, d'ou l'ecoute en phase de capture
            $('grid').addEventListener('error', (e) => {
                const img = e.target;
                if (!img || img.tagName !== 'IMG') return;
                const card = img.closest('.grid-item');
                if (card) card.setAttribute('data-broken', '');
            }, true);
            $('lightbox-img').addEventListener('error', () => $('lightboxHalo').setAttribute('data-broken', ''));

            // Fermeture des modales : bouton x ou clic sur le fond
            $('helpCloseBtn').addEventListener('click', closeHelp);
            $('lightboxCloseBtn').addEventListener('click', closeLightbox);
            $('helpLightbox').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeHelp(); });
            $('lightbox').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeLightbox(); });

            $('copyBtn').addEventListener('click', () => { if (lightboxState) copyImage(lightboxState.url); });
            $('singleDlBtn').addEventListener('click', () => { if (lightboxState) forceDownload(lightboxState.url, lightboxState.filename); });
        }

        async function boot() {
            try {
                const [i18nMod, utilsMod] = await Promise.all([
                    import('./shared/i18n.js'),
                    import('./shared/poseNameUtils.js')
                ]);
                I18N = i18nMod.I18N;
                poseFileTags = utilsMod.poseFileTags;
                if (!I18N || !I18N.en) throw new Error('Dictionnaire i18n invalide');
                if (typeof poseFileTags !== 'function') throw new Error('Utilitaires de nommage invalides');
            } catch (err) {
                console.error(err);
                showFatal();
                return;
            }

            // Valeurs enregistrees (ID valides uniquement)
            $('id1').value = validId(store.get('bt_id1') || '');
            $('id2').value = validId(store.get('bt_id2') || '');
            $('name1').value = (store.get('bt_name1') || '').slice(0, 40);
            $('name2').value = (store.get('bt_name2') || '').slice(0, 40);
            syncClearButtons();

            // Langue enregistree si valide, sinon detection navigateur
            const saved = store.get('bt_lang');
            const lang = saved && hasLang(saved) ? saved : detectLang();
            $('langSelect').value = lang;

            wireEvents();
            applyTranslations(lang);
            await loadData(lang);
        }

        boot();
    </script>
</body>
