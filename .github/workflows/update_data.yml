name: Mise à jour automatique du catalogue

on:
  push:
    branches: [ main ]
    # Seuls le script de collecte (et ce qu'il importe) ou ce workflow relancent une collecte :
    # un push du README ou du front ne doit pas déclencher de mise à jour du catalogue.
    paths:
      - 'public/get_templates.js'
      - 'public/shared/poseNameUtils.js'
      - '.github/workflows/update_data.yml'
  workflow_dispatch: # Ajoute ce bouton pour tester manuellement !
  schedule:
    - cron: '0 6 * * 1'   # tous les lundis à 06:00 UTC (08:00 Paris en été)

# Aucun droit par défaut : le job déclare uniquement ce dont il a besoin.
permissions: {}

concurrency:
  group: update-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Filet de sécurité : sans limite, un amont bloqué pourrait figer le job pendant 6 h.
    timeout-minutes: 15
    permissions:
      contents: write # commit + push des templates_*.json et d'aide.json

    steps:
      # Actions épinglées par SHA complet (tag en commentaire), mises à jour par Dependabot.
      - name: 📥 Récupération du code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Un run mis en file par `concurrency` doit repartir de la branche à jour, pas du
          # commit qui l'a déclenché : sinon il régénère les données sur un état périmé et
          # son rebase entre en conflit avec le commit auto du run précédent (aide.json).
          ref: ${{ github.ref_name }}

      - name: 🟢 Installation de Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24' # On force Node 24 pour 2026

      - name: ⚙️ Exécution du script
        working-directory: public
        # get_templates.js (CommonJS) importe shared/poseNameUtils.js (module ES) : on masque
        # l'avertissement de détection de type de module, sans effet sur le résultat.
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON get_templates.js

      - name: 📤 Sauvegarde
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions[bot]"
          git add public/templates_*.json public/aide.json
          # Pas de [skip ci] : l'intégration Git de Cloudflare Pages déploie ce commit d'elle-même.
          # Aucune boucle possible : un push fait avec GITHUB_TOKEN ne relance pas de workflow,
          # et le filtre `paths` du déclencheur exclut de toute façon les fichiers de données.
          git commit -m "🚀 Mise à jour auto du catalogue" || echo "Aucune modification à commit"
          # Si main a bougé depuis le checkout (ex: push manuel entre-temps), on rebase
          # avant de pousser plutôt que d'échouer sèchement sur un push rejeté.
          git pull --rebase origin main
          git push

      # Facultatif : le déploiement se fait déjà via l'intégration Git de Cloudflare Pages
      # (commit auto ci-dessus). Si un Deploy Hook est configuré, il force en plus un
      # redéploiement, utile pour rattraper un déploiement précédent qui aurait échoué.
      - name: 🚀 Force redeploy Cloudflare (facultatif)
        env:
          CF_DEPLOY_HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
        run: |
          if [ -z "${CF_DEPLOY_HOOK}" ]; then
            echo "::notice::Pas de secret CF_DEPLOY_HOOK : le déploiement repose sur l'intégration Git de Cloudflare Pages."
            exit 0
          fi
          curl -fsS --max-time 30 --retry 3 -X POST "${CF_DEPLOY_HOOK}" -o /dev/null
